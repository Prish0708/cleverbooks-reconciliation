version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: cleverbooks-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - cleverbooks-network

  redis:
    image: redis:7-alpine
    container_name: cleverbooks-redis
    ports:
      - '6379:6379'
    networks:
      - cleverbooks-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleverbooks-backend
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://mongo:27017/cleverbooks
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - RECONCILE_CRON=30 20 * * *
      - WEBHOOK_URL=${WEBHOOK_URL}
      - TZ=Asia/Kolkata
    depends_on:
      - mongo
      - redis
    networks:
      - cleverbooks-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cleverbooks-frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - cleverbooks-network

volumes:
  mongo-data:

networks:
  cleverbooks-network:
    driver: bridge